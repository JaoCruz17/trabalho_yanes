<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Gestor de Produtos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="/firebase.js"></script>

  <!-- SCRIPT DO RECAPTCHA DO GOOGLE -->
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>

<body class="min-h-screen flex items-center justify-center 
bg-gradient-to-br from-blue-600 via-blue-500 to-indigo-600 p-4">

  <div class="bg-white/20 backdrop-blur-xl p-8 rounded-3xl shadow-2xl 
              w-full max-w-sm border border-white/30 animate-fadeIn">

    <h1 class="text-3xl font-bold text-white text-center mb-6 drop-shadow-md">
      Gestor de Produtos
    </h1>

    <form id="loginForm" class="space-y-5">

      <div>
        <label class="text-white font-semibold">Email</label>
        <input id="email" type="email" placeholder="Digite seu email"
          class="w-full mt-1 p-3 rounded-xl bg-white/30 text-white placeholder-white/60
                 border border-white/20 focus:ring-2 focus:ring-white focus:outline-none" 
          required />
      </div>

      <div>
        <label class="text-white font-semibold">Senha</label>
        <input id="password" type="password" placeholder="Digite sua senha"
          class="w-full mt-1 p-3 rounded-xl bg-white/30 text-white placeholder-white/60
                 border border-white/20 focus:ring-2 focus:ring-white focus:outline-none" 
          required />
      </div>

      <!-- RECAPTCHA -->
      <div class="g-recaptcha" data-sitekey="SUA_SITE_KEY_AQUI"></div>

      <button type="submit"
        class="w-full bg-white text-blue-600 font-bold py-3 rounded-xl shadow-lg
               hover:bg-gray-100 transition transform hover:scale-[1.02]">
        Entrar
      </button>

      <p class="text-center text-white/80 text-sm mt-3">
        Sistema seguro - acesso restrito
      </p>
    </form>
  </div>

  <script type="module">
    import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
    import { auth } from "./firebase.js";

    const loginForm = document.getElementById("loginForm");

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      // 🔒 VERIFICAÇÃO DO RECAPTCHA
      const recaptcha = grecaptcha.getResponse();
      if (!recaptcha) {
        alert("Por favor, confirme que você não é um robô.");
        return;
      }

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = "dashboard.html";
      } catch (error) {
        alert("Usuário ou senha incorretos");
        console.error(error);
      }
    });
  </script>

  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.6s ease-out;
    }
  </style>

</body>
</html>
